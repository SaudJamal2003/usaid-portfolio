# Isolated stack for the portfolio CMS.
#
# Everything here is namespaced under the `usaidux-cms` project and uses
# non-default host ports, because the target VPS runs other applications:
# a stock 5432/9000 mapping would collide with whatever is already there.
# Nothing in this file touches a host network, an existing volume, or a
# reverse proxy — the CMS is published through whichever proxy already runs
# on the box, pointed at 127.0.0.1:${CMS_PORT}.

name: usaidux-cms

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Bound to loopback only: the database is never reachable from outside.
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - cms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [cms]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MINIO_PORT:-59000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-59001}:9001"
    volumes:
      - cms_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [cms]

  # One-shot: creates the bucket and makes the object prefix publicly readable
  # so the portfolio can load media without signing every URL.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-portfolio-media}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${MINIO_BUCKET} &&
      mc anonymous set download local/$${MINIO_BUCKET} &&
      echo 'bucket ready'
      "
    networks: [cms]

volumes:
  cms_postgres_data:
    name: usaidux_cms_postgres_data
  cms_minio_data:
    name: usaidux_cms_minio_data

networks:
  cms:
    name: usaidux_cms_network
