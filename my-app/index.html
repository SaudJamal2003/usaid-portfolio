<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- SVG carries the signature and follows the tab's colour scheme.
         favicon.ico is the raster fallback browsers fetch on their own. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Usaid Ahmed — product designer. Design is my favorite thing to overthink."
    />

    <!-- Open Graph / social sharing. This is a static Vite build with no SSR and
         crawlers do not run the app's JavaScript, so these belong in the HTML
         rather than being set from React. Absolute URLs are mandatory — every
         scraper rejects relative ones. The origin is www, not the apex: the
         apex 308s to www, and several scrapers will not follow a redirect on
         og:image. It appears in three places below; change all three together
         if the domain moves. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Usaid Ahmed" />
    <meta property="og:url" content="https://www.usaidux.space/" />
    <meta property="og:title" content="Usaid Ahmed - UX Designer" />
    <meta property="og:description" content="Usaid Ahmed — product designer. Design is my favorite thing to overthink." />
    <meta property="og:image" content="https://www.usaidux.space/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Usaid Ahmed — Design is my favorite thing to Overthink"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Usaid Ahmed - UX Designer" />
    <meta name="twitter:description" content="Usaid Ahmed — product designer. Design is my favorite thing to overthink." />
    <meta name="twitter:image" content="https://www.usaidux.space/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Figtree:wght@400;500;600&family=Inter+Tight:wght@400;500&family=Inter:wght@500&family=Nanum+Brush+Script&display=swap"
      rel="stylesheet"
    />
    <title>Usaid Ahmed - UX Designer</title>
    <!-- The signature loader paints white; match it here so the gap before
         React mounts is the same white sheet and never flashes. -->
    <style>
      html,
      body {
        background-color: #ffffff;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
